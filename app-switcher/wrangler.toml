name = "app-switcher"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Every rn.ax hostname reaches the worker; src/index.ts passes through any host
# that is not listed in APPS. The wildcard does not match the bare apex, so
# that gets its own route. Routes take precedence over Custom Domains on the
# same hostname, and the passthrough fetch reaches those workers unchanged.
[[routes]]
pattern = "*.rn.ax/*"
zone_name = "rn.ax"

[[routes]]
pattern = "rn.ax/*"
zone_name = "rn.ax"
