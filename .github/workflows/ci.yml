name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  worker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [app-switcher, rater, windmill-mail-router, windmill-public-proxy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Install dependencies
        working-directory: ${{ matrix.worker }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.worker }}
        run: npm run build --if-present

      - name: Test
        working-directory: ${{ matrix.worker }}
        run: npm test --if-present

      - name: Deploy
        if: github.event_name == 'push'
        working-directory: ${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: npx wrangler deploy
